<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>GlassBeat Story</title>
  <link rel="stylesheet" href="story.css?v=20260831-7">
  <link rel="stylesheet" href="credits.css?v=20260831-10">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="assetLoadingScreen" role="status" aria-live="polite">
    <div id="assetLoadingTip">
      <span id="assetLoadingTipLabel">TIPS</span>
      <span id="assetLoadingTipText"></span>
    </div>
    <div id="assetLoadingText">ロード中<span>......</span></div>
  </div>

  <div id="storyBackground"></div>
  <div id="storyPage">

  <aside id="chapterSide">
    <h1>STORY</h1>

    <div id="chapterList"></div>

    <button id="storyBackButton">BACK</button>
  </aside>

  <main id="episodeSide">
  <div id="chapterTitle">はじまりの歌</div>

  <div id="episodeArea">
    <div id="episodeList"></div>
    <div id="fragmentEpisodeList"></div>
  </div>

  <div id="lockedStoryMessage"></div>
</main>
</div>

<div id="readingOverlay" class="hidden">
 <img id="storyIntroImage" class="hidden" src="" alt="">
  <div id="storyText"></div>
  <button id="readingPrevButton">前のページへ</button>
  <button id="readingBackButton">戻る</button>
</div>

<div id="storyIntroFade"></div>

<div id="song9DifficultyOverlay" class="hidden">
  <div id="song9DifficultyPanel">
    <div id="song9DifficultyTitle">難易度を選んでください</div>
    <div id="song9DifficultyButtons">
      <button data-difficulty="0">BASIC</button>
      <button data-difficulty="1">EXPERT</button>
    </div>
  </div>
</div>

<div id="boss2DifficultyOverlay" class="hidden">
  <div id="boss2DifficultyPanel">
    <div id="boss2DifficultyTitle">難易度を選んでください</div>

    <div id="boss2DifficultyButtons">
      <button data-difficulty="0">BASIC</button>
      <button data-difficulty="1">EXPERT</button>
      <button data-difficulty="2">FRACTURE</button>
    </div>
  </div>
</div>

<div id="partnerUnlockOverlay" class="hidden">
  <div id="partnerUnlockInner">
    <img id="partnerUnlockImage" src="" alt="">
    <div id="partnerUnlockText">キャラクターが解禁されました</div>
    <div id="partnerUnlockName"></div>
  </div>
</div>

<div id="boss2IntroOverlay" class="hidden">
  <img id="boss2IntroImage" src="" alt="">
  <div id="boss2LightParticles"></div>
  <div id="boss2CenterGlow"></div>
  <div id="boss2WhiteDissolve"></div>
</div>

<div id="creditsRoot">
  <div id="creditsBackdrop" aria-hidden="true"></div>
  <main id="creditsViewport" aria-label="スタッフロール">
    <div id="creditsTrack"></div>
  </main>
  <div id="creditsSoundPrompt" aria-live="polite">CLICK FOR SOUND</div>
  <button id="creditsSkip" type="button">SKIP</button>
  <div id="creditsFade" aria-hidden="true"></div>
</div>

  <script src="loading-tips.js"></script>
  <script src="credits.js?v=20260831-16"></script>
  <script src="story.js?v=20260831-9"></script>
</body>
</html>
